; PHP configuration for the Vercel function.
;
; Errors go to stderr rather than to the browser: Vercel collects stderr into
; the deployment logs, which is the only place a stack trace can be read once
; the filesystem is read-only.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 55

; Vercel refuses a request body over 4.5 MB at the edge, so anything larger
; never reaches PHP. These sit just under that.
upload_max_filesize = 4M
post_max_size = 5M

date.timezone = Asia/Makassar
